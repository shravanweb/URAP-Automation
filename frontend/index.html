<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="URAP is an open automation platform: design workflows in Studio, run them on robots, and manage jobs, queues, and human tasks in Orchestrator." />
    <meta name="theme-color" content="#172125" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Universal RPA Automation Platform</title>
    <style>
      .urap-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FBF8F5; font: 500 13px/1.4 Inter, system-ui, sans-serif; color: #6B7280; letter-spacing: .02em; }
      .urap-boot-ring { position: relative; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; border: 2px solid #F1E7DD; }
      .urap-boot-ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid transparent; border-top-color: #FA4616; border-right-color: rgba(250,70,22,.35); animation: urap-boot-spin .9s cubic-bezier(.5,.15,.5,.85) infinite; }
      .urap-boot-ring img { width: 34px; height: 34px; object-fit: contain; }
      @keyframes urap-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .urap-boot-ring::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot loader: shown until React mounts (replaced by the app). Pure CSS, no JS. -->
      <div class="urap-boot" role="status" aria-label="Loading URAP">
        <span class="urap-boot-ring"><img src="/favicon.png" alt="" width="34" height="34" /></span>
        <span class="urap-boot-label">Loading URAP…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
